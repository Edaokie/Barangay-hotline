[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[endpoint-tpl](!)
type=endpoint
context=lab
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[1001](endpoint-tpl)
auth=1001
aors=1001
callerid="Phone A" <1001>
[1001](auth-tpl)
username=1001
password=<redacted>
[1001](aor-tpl)

[1002](endpoint-tpl)
auth=1002
aors=1002
callerid="Phone B" <1002>
[1002](auth-tpl)
username=1002
password=<redacted>
[1002](aor-tpl)

[1003](endpoint-tpl)
auth=1003
aors=1003
callerid="Responder 2" <1003>
[1003](auth-tpl)
username=1003
password=<redacted>
[1003](aor-tpl)
