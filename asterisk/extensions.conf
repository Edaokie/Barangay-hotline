[lab]
; extension to extension, voicemail after 20 s
exten => _100X,1,NoOp(Call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; echo test
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; prompt recorder: dial 7 + number, speak after the beep, press # to stop
exten => _7XXX,1,Answer()
 same => n,Wait(1)
 same => n,Record(/var/lib/asterisk/sounds/custom/prompt-${EXTEN:1}.wav,3,60)
 same => n,Wait(1)
 same => n,Playback(custom/prompt-${EXTEN:1})
 same => n,Hangup()

; BARANGAY HOTLINE
;exten => 8000,1,Answer()
 exten => 8000,1,Goto(hotline-ivr,s,1) 

; same => n,Wait(1)
; same => n,Playback(custom/prompt-101)          ; consent notice
; same => n,MixMonitor(hotline-${STRFTIME(,,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav,b)
