; check voicemail
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

[hotline-ivr]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/prompt-101)              ; consent notice
 same => n,Set(TRIES=0)
 same => n(menu),Background(custom/prompt-102)     ; the menu
 same => n,WaitExten(5)

exten => 1,1,Set(CAT=fire)
 same => n,Goto(route,1)
exten => 2,1,Set(CAT=medical)
 same => n,Goto(route,1)
exten => 3,1,Set(CAT=peace)
 same => n,Goto(route,1)

; common routing for every category
exten => route,1,NoOp(Category ${CAT} from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=${CAT})
 same => n,MixMonitor(${CAT}-${STRFTIME(,,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav,b)
 same => n,Playback(custom/prompt-103)
 same => n,Queue(q-${CAT},t,,,60)
 same => n,Playback(custom/prompt-104)
 same => n,VoiceMail(1002@default)
 same => n,Hangup()

; wrong key: repeat the menu
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,menu)

; no key: repeat once, then general queue
exten => t,1,Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES}<2]?s,menu)
 same => n,Set(CAT=general)
 same => n,Goto(route,1)
