[lab]
; extension to extension, voicemail after 20 s
exten => _100X,1,NoOp(Call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; echo test
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; prompt recorder: dial 7 + number, speak after the beep, press # to stop
exten => _7XXX,1,Answer()
 same => n,Wait(1)
 same => n,Record(/var/lib/asterisk/sounds/custom/prompt-${EXTEN:1}.wav,3,60)
 same => n,Wait(1)
 same => n,Playback(custom/prompt-${EXTEN:1})
 same => n,Hangup()

; BARANGAY HOTLINE
;exten => 8000,1,Answer()
 exten => 8000,1,Goto(hotline-ivr,s,1) 

; same => n,Wait(1)
; same => n,Playback(custom/prompt-101)          ; consent notice
; same => n,MixMonitor(hotline-${STRFTIME(,,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav,b)
; same => n,Playback(custom/prompt-103)          ; "connecting you..."
; same => n,Queue(q-general,t,,,120)
; same => n,Playback(custom/prompt-104)          ; "no one available..."
; same => n,VoiceMail(1002@default)
; same => n,Hangup()

; check voicemail
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

[hotline-ivr]
exten => s,1,Set(CHANNEL(hangup_handler_push)=qos-log,s,1)  ; Day 6: log call quality at hangup
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/prompt-101)              ; consent notice
 same => n,Set(TRIES=0)
 same => n(menu),Background(custom/prompt-102)     ; the menu
 same => n,WaitExten(5)

exten => 1,1,Set(CAT=fire)
 same => n,Goto(route,1)
exten => 2,1,Set(CAT=medical)
 same => n,Goto(route,1)
exten => 3,1,Set(CAT=peace)
 same => n,Goto(route,1)

; common routing for every category
exten => route,1,NoOp(Category ${CAT} from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=${CAT})
 same => n,MixMonitor(${CAT}-${STRFTIME(,,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav,b)
 same => n,Playback(custom/prompt-103)
 same => n,Queue(q-${CAT},t,,,60)
 same => n,Playback(custom/prompt-104)
 same => n,VoiceMail(1002@default)
 same => n,Hangup()

; wrong key: repeat the menu
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,menu)

; no key: repeat once, then general queue
exten => t,1,Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES}<2]?s,menu)
 same => n,Set(CAT=general)
 same => n,Goto(route,1)

[web]
; Day 5: browser callers (endpoint 1004) can only reach the hotline.
; X-Location = "lat/lon/accuracy_m" from the page; logged with the call's
; UNIQUEID so it joins to cdr-csv/Master.csv. FILTER strips anything else.
exten => 8000,1,Set(LOC=${FILTER(-0-9./,${PJSIP_HEADER(read,X-Location)})})
 same => n,Set(LOC=${IF($["${LOC}" = ""]?none:${LOC:0:64})})
 same => n,NoOp(Web call from ${CALLERID(num)} location=${LOC})
 same => n,Set(FILE(/var/log/asterisk/locations.csv,,,al)=${STRFTIME(,,%Y-%m-%d %H:%M:%S)},${UNIQUEID},${CALLERID(num)},${LOC})
 same => n,Goto(hotline-ivr,s,1)

exten => _X.,1,Playback(pbx-invalid)
 same => n,Hangup()

[qos-log]
; Day 6: hangup handler - one row per hotline call with Asterisk's RTCP stats
; (rxjitter/txjitter in seconds, lp = packets we lost, rlp = packets the far end lost, rtt in seconds)
exten => s,1,Set(FILE(/var/log/asterisk/qos.csv,,,al)=${STRFTIME(,,%Y-%m-%d %H:%M:%S)},${UNIQUEID},${CALLERID(num)},${IF($["${CAT}" = ""]?none:${CAT})},${CDR(billsec)},${CHANNEL(rtcp,all)})
 same => n,Return()
